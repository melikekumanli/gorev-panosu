name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code rules
        run: npm run lint

      - name: Build application
        run: npm run build
              - name: Build Docker image
        run: docker build -t gorev-panosu:ci .

      - name: Start container
        run: |
          docker run --name gorev-panosu-ci \
            -d \
            -p 127.0.0.1:8080:8080 \
            gorev-panosu:ci

      - name: Check container HTTP responses
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8080/health \
            -o /tmp/health.txt

          grep -qx 'ok' /tmp/health.txt

          curl --fail --silent --show-error \
            --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8080/ \
            -o /tmp/index.html

          grep -qi '<html' /tmp/index.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs gorev-panosu-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f gorev-panosu-ci || true

      - name: Upload website files
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5